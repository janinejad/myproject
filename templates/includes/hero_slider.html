{% load static %}

<section class="container mx-auto px-4 lg:px-8 my-6">
    <div id="hero-slider" class="relative group">
        <div class="slider-track flex overflow-x-auto snap-x snap-mandatory scroll-smooth rounded-3xl shadow-xl [scrollbar-width:none] [-ms-overflow-style:none] [::-webkit-scrollbar]:hidden">

            <!-- اسلاید ۱ -->
            <div class="snap-start min-w-full flex-shrink-0 relative h-[260px] sm:h-[340px] bg-gradient-to-r from-[#1A1A80] to-indigo-900 text-white flex items-center justify-center p-6 text-center">
                <div class="max-w-2xl space-y-3">
                    <span class="inline-block bg-[#FF9933]/20 border border-[#FF9933]/40 text-[#FF9933] text-xs font-bold px-3 py-1 rounded-full">مرجع جامع مشاغل شهری</span>
                    <h2 class="text-2xl sm:text-4xl font-black text-white leading-tight">بهترین کسب‌وکارها و خدمات را آنلاین پیدا کنید</h2>
                    <p class="text-gray-200 text-xs sm:text-sm">دسترسی سریع به هزاران کسب‌وکار، کالا و خدمات معتبر</p>
                    <div class="pt-2">
                        <a href="/businesses/" class="inline-block bg-[#FF9933] hover:bg-amber-600 text-white text-xs sm:text-sm font-bold py-2.5 px-6 rounded-xl shadow-lg transition">مشاهده همه مشاغل</a>
                    </div>
                </div>
            </div>

            <!-- اسلاید ۲ -->
            <div class="snap-start min-w-full flex-shrink-0 relative h-[260px] sm:h-[340px] bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-center p-6 text-center">
                <div class="max-w-2xl space-y-3">
                    <span class="inline-block bg-orange-500/20 border border-orange-400/40 text-orange-400 text-xs font-bold px-3 py-1 rounded-full">ویژه صاحبان مشاغل</span>
                    <h2 class="text-2xl sm:text-4xl font-black text-white leading-tight">کسب‌وکار خود را رایگان معرفی کنید</h2>
                    <p class="text-gray-300 text-xs sm:text-sm">مشتریان جدید پیدا کنید و فروش خود را افزایش دهید</p>
                    <div class="pt-2">
                        <a href="/add-business/" class="inline-block bg-[#FF9933] hover:bg-amber-600 text-white text-xs sm:text-sm font-bold py-2.5 px-6 rounded-xl shadow-lg transition">+ ثبت آنلاین کسب‌وکار</a>
                    </div>
                </div>
            </div>

        </div>

        <button class="slider-prev absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-[#1A1A80] w-10 h-10 rounded-full shadow-lg flex items-center justify-center transition opacity-80 hover:opacity-100 z-10">❮</button>
        <button class="slider-next absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-[#1A1A80] w-10 h-10 rounded-full shadow-lg flex items-center justify-center transition opacity-80 hover:opacity-100 z-10">❯</button>
    </div>
</section>
